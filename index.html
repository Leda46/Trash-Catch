<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trash Catch Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    canvas {
      display: none;
    }
    #startScreen, #rulesScreen, #customizeScreen, #endScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #87ceeb;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: rgb(0, 0, 0);
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <!-- Start Screen -->
  <div id="startScreen">
    <h1>Trash Catch Game</h1>
    <button onclick="startGame()">Start Game</button>
    <button onclick="customizeBin()">Customize Bin</button>
    <button onclick="showRules()">Rules</button>
  </div>

  <div id="rulesScreen" style="display: none;">
    <h1>Rules</h1>
    <p>Move the bin using the arrow keys to collect falling trash.</p>
    <p>Each piece of trash collected adds to your score.</p>
    <p>If trash reaches the ground, it disappears.</p>
    <p>Good luck and remember not to litter!</p>
    <button onclick="backToStart()">Back</button>
  </div>
  
  <!-- Customize Bin Screen -->
  <div id="customizeScreen" style="display: none;">
    <h1>Customize Your Bin</h1>
    <label for="binColor">Choose Bin Color:</label>
   <input type="color" id="binColor" value="#517b56"><br>
    <button onclick="saveCustomization()">Save</button>
    <button onclick="backToStart()">Back</button>
  </div>

  <!-- End Screen -->
  <div id="endScreen" style="display: none;">
    <h1>Game Over</h1>
    <p id="finalScore"></p>
    <button onclick="backToStart()">Back to Start Screen</button>
  </div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <p id="score">Score: 0</p>
    <p id="timer">Time Left: 60s</p>
  </div>

  <script src="trashcatch.js"></script>
</body>
</html>
